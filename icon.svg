<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Deep Obsidian Background Gradient -->
    <radialGradient id="bgObsidian" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="55%" stop-color="#060b16" />
      <stop offset="100%" stop-color="#020409" />
    </radialGradient>

    <!-- Outer Metallic Prestige Bezel -->
    <linearGradient id="bezelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="30%" stop-color="#6366f1" />
      <stop offset="65%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Study Ring Gradient (Sapphire to Cyan) -->
    <linearGradient id="studyArc" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Deen & Barakah Ring Gradient (Emerald to Gold) -->
    <linearGradient id="deenArc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Pomodoro Focus Pulse Gradient (Crimson to Amber) -->
    <linearGradient id="focusArc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fb923c" />
    </linearGradient>

    <!-- Royal Gold Accent Gradient -->
    <linearGradient id="goldRoyal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="45%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Book Pages Ivory-Cyan Illumination -->
    <linearGradient id="pageLeftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="pageRightGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <!-- Soft Neon Glow Filter -->
    <filter id="apexGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 1. Outer Squircle Crest & Metallic Bezel -->
  <rect x="10" y="10" width="492" height="492" rx="112" fill="url(#bezelGrad)" />
  <rect x="20" y="20" width="472" height="472" rx="104" fill="url(#bgObsidian)" />
  <rect x="34" y="34" width="444" height="444" rx="92" fill="none" stroke="#1e293b" stroke-width="2.5" />

  <!-- 2. Subtle Rub el Hizb (8-Point Islamic Geometric Knowledge Star) Watermark -->
  <g opacity="0.10" stroke="#38bdf8" stroke-width="2" fill="none" transform="translate(256, 256)">
    <rect x="-150" y="-150" width="300" height="300" rx="12" />
    <rect x="-150" y="-150" width="300" height="300" rx="12" transform="rotate(45)" />
    <circle cx="0" cy="0" r="185" stroke-dasharray="6 8" />
  </g>

  <!-- 3. Top Chronograph Crown & Side Tactical Pushers -->
  <rect x="234" y="36" width="44" height="16" rx="6" fill="#475569" />
  <rect x="216" y="22" width="80" height="20" rx="10" fill="url(#goldRoyal)" />
  <path d="M396 96 L420 72 L434 86 L410 110 Z" fill="#64748b" />
  <path d="M116 96 L92 72 L78 86 L102 110 Z" fill="#64748b" />

  <!-- 4. Outer Tachymeter & Tri-Pillar Progress Ring (Study + Deen + Focus) -->
  <circle cx="256" cy="264" r="188" fill="none" stroke="#0f172a" stroke-width="24" />
  
  <!-- Sapphire Study Arc -->
  <path d="M 256 76 A 188 188 0 0 1 438 312" fill="none" stroke="url(#studyArc)" stroke-width="20" stroke-linecap="round" filter="url(#apexGlow)" />
  <!-- Emerald Deen Arc -->
  <path d="M 426 346 A 188 188 0 0 1 86 346" fill="none" stroke="url(#deenArc)" stroke-width="20" stroke-linecap="round" />
  <!-- Crimson Pomodoro Sprint Arc -->
  <path d="M 74 312 A 188 188 0 0 1 220 79" fill="none" stroke="url(#focusArc)" stroke-width="20" stroke-linecap="round" />

  <!-- Precision Dial Ticks -->
  <g stroke="#475569" stroke-width="3" stroke-linecap="round">
    <line x1="256" y1="98" x2="256" y2="112" stroke="#f8fafc" stroke-width="4" />
    <line x1="422" y1="264" x2="408" y2="264" stroke="#f8fafc" stroke-width="4" />
    <line x1="90" y1="264" x2="104" y2="264" stroke="#f8fafc" stroke-width="4" />
    <line x1="339" y1="120" x2="332" y2="132" />
    <line x1="399" y1="181" x2="387" y2="188" />
    <line x1="173" y1="120" x2="180" y2="132" />
    <line x1="113" y1="181" x2="125" y2="188" />
  </g>

  <!-- 5. Golden Crescent & Guiding North Star (Deen & Life Compass Tier 1) -->
  <g transform="translate(152, 146)">
    <path d="M26 -18 A 34 34 0 1 0 58 36 A 27 27 0 1 1 26 -18 Z" fill="url(#goldRoyal)" filter="url(#apexGlow)" />
    <polygon points="56,-8 60,2 70,2 62,8 65,18 56,12 47,18 50,8 42,2 52,2" fill="#fef08a" />
  </g>

  <!-- 6. Floating Visual Diagram / Pie-Chart Node (Smart TXT + Visual Concept Symbol) -->
  <g transform="translate(340, 156)">
    <circle cx="0" cy="0" r="28" fill="#0f172a" stroke="#38bdf8" stroke-width="3" />
    <path d="M0,0 L0,-22 A22,22 0 0,1 19,11 Z" fill="#38bdf8" />
    <path d="M0,0 L19,11 A22,22 0 0,1 -19,11 Z" fill="#10b981" />
    <path d="M0,0 L-19,11 A22,22 0 0,1 0,-22 Z" fill="#f59e0b" />
  </g>

  <!-- 7. Central Vector Fountain Pen Nib & Compass Needle (Knowledge + Precision) -->
  <g transform="translate(256, 232)">
    <!-- Minute & Hour Hands -->
    <line x1="0" y1="10" x2="68" y2="-38" stroke="url(#focusArc)" stroke-width="12" stroke-linecap="round" />
    <!-- Vector Fountain Pen Nib Spire -->
    <path d="M0,-96 L24,-24 L14,22 L-14,22 L-24,-24 Z" fill="url(#goldRoyal)" stroke="#0f172a" stroke-width="3" />
    <line x1="0" y1="-92" x2="0" y2="-36" stroke="#0f172a" stroke-width="4" stroke-linecap="round" />
    <circle cx="0" cy="-32" r="6" fill="#0f172a" />
  </g>

  <!-- 8. 3D Wooden Shelf Base & Illuminated Open Codex Book -->
  <g transform="translate(256, 344)">
    <!-- 3D Mahogany/Walnut Book Cover Base -->
    <path d="M-136,-52 C-85,-64 -32,-54 0,-36 C32,-54 85,-64 136,-52 L144,36 C90,24 34,34 0,52 C-34,34 -90,24 -144,36 Z" fill="#059669" stroke="#34d399" stroke-width="4" />

    <!-- Left Page (Text + Highlight Bars) -->
    <path d="M-126,-62 C-80,-74 -30,-64 -4,-44 L-4,38 C-32,20 -82,12 -132,24 Z" fill="url(#pageLeftGrad)" />
    <!-- Right Page (Diagram + Arabic/RTL & LTR Lines) -->
    <path d="M126,-62 C80,-74 30,-64 4,-44 L4,38 C32,20 82,12 132,24 Z" fill="url(#pageRightGrad)" />

    <!-- Highlighted Text Lines on Left Page -->
    <line x1="-106" y1="-42" x2="-28" y2="-32" stroke="#f59e0b" stroke-width="7" stroke-linecap="round" />
    <line x1="-108" y1="-22" x2="-26" y2="-12" stroke="#2563eb" stroke-width="6" stroke-linecap="round" />
    <line x1="-110" y1="-4" x2="-46" y2="4" stroke="#64748b" stroke-width="6" stroke-linecap="round" />

    <!-- Visual Concept Box & Lines on Right Page -->
    <rect x="24" y="-46" width="34" height="26" rx="5" fill="#10b981" opacity="0.85" />
    <line x1="68" y1="-40" x2="108" y2="-45" stroke="#0f172a" stroke-width="6" stroke-linecap="round" />
    <line x1="68" y1="-24" x2="104" y2="-29" stroke="#f43f5e" stroke-width="6" stroke-linecap="round" />
    <line x1="24" y1="-4" x2="108" y2="-14" stroke="#475569" stroke-width="6" stroke-linecap="round" />

    <!-- Center Gold Spine & Crimson Ribbon Bookmark -->
    <rect x="-8" y="-50" width="16" height="94" rx="8" fill="url(#goldRoyal)" />
    <path d="M-6,42 L6,42 L6,82 L0,72 L-6,82 Z" fill="#f43f5e" />
  </g>

  <!-- Chronograph Center Pivot -->
  <circle cx="256" cy="242" r="14" fill="url(#goldRoyal)" stroke="#0f172a" stroke-width="4" />
</svg>
